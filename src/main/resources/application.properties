# Application Configuration

# Server
server.port=9123

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/turfdb}

# Spring Mail Configuration (Gmail SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-gmail@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.debug=false

# JWT Configuration
jwt.secret=${JWT_SECRET:YourSuperSecretKeyForJWTSigning}
jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# Stripe Configuration
stripe.api.key=${STRIPE_API_KEY:sk_test_PLACEHOLDER}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:whsec_PLACEHOLDER}

# Logging
logging.level.com.example.turf=INFO
logging.level.org.springframework.mail=DEBUG

