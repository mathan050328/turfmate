<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard — Turf Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root { --primary: #4df33b; --bg: #050a15; --card-bg: rgba(20,30,48,0.85); --border: rgba(255,255,255,0.08); }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: #f0f4f8; min-height: 100vh; }

        .admin-nav {
            background: rgba(5,10,21,0.95); border-bottom: 1px solid var(--border);
            padding: 14px 30px; display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
        }
        .admin-nav .brand { font-size: 1.3rem; font-weight: 800; color: var(--primary); }
        .admin-nav .brand span { color: #fff; }
        .back-btn {
            background: rgba(255,255,255,0.07); border: 1px solid var(--border);
            color: #f0f4f8; padding: 7px 18px; border-radius: 8px;
            text-decoration: none; font-size: 0.88rem; transition: all .2s;
        }
        .back-btn:hover { background: rgba(255,255,255,0.13); color: #fff; }

        .page { max-width: 1300px; margin: 0 auto; padding: 30px 20px; }

        /* Stat cards */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px,1fr)); gap: 16px; margin-bottom: 30px; }
        .stat-card {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
            padding: 20px; backdrop-filter: blur(8px);
        }
        .stat-icon { width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1.2rem; margin-bottom:10px; }
        .stat-label { font-size:0.78rem; color:#a0aabf; text-transform:uppercase; letter-spacing:.5px; }
        .stat-value { font-size:1.8rem; font-weight:800; margin-top:4px; }
        .ic-green  { background:rgba(77,243,59,0.12);   color:var(--primary); }
        .ic-blue   { background:rgba(59,130,246,0.12);  color:#60a5fa; }
        .ic-yellow { background:rgba(251,191,36,0.12);  color:#fbbf24; }
        .ic-red    { background:rgba(239,68,68,0.12);   color:#f87171; }
        .ic-purple { background:rgba(167,139,250,0.12); color:#a78bfa; }
        .ic-cyan   { background:rgba(34,211,238,0.12);  color:#22d3ee; }
        .ic-orange { background:rgba(251,146,60,0.12);  color:#fb923c; }

        /* Table card */
        .table-card { background:var(--card-bg); border:1px solid var(--border); border-radius:16px; overflow:hidden; backdrop-filter:blur(8px); }
        .table-header {
            padding:18px 22px; border-bottom:1px solid var(--border);
            display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px;
        }
        .table-header h5 { font-size:1rem; font-weight:700; margin:0; }
        .controls { display:flex; gap:8px; flex-wrap:wrap; }
        .search-box {
            background:rgba(255,255,255,0.05); border:1px solid var(--border);
            border-radius:8px; color:#f0f4f8; padding:7px 13px;
            font-size:0.86rem; width:210px; outline:none; transition:border-color .2s;
        }
        .search-box:focus { border-color:var(--primary); }
        .flt {
            background:rgba(255,255,255,0.05); border:1px solid var(--border);
            border-radius:8px; color:#f0f4f8; padding:7px 11px; font-size:0.86rem; outline:none; cursor:pointer;
        }
        .flt option { background:#0d1b2a; }
        .refresh-btn {
            background:var(--primary); border:none; color:#000;
            padding:7px 15px; border-radius:8px; font-weight:700; font-size:0.84rem; cursor:pointer;
        }
        .refresh-btn:hover { opacity:.85; }
        .count-pill {
            background:rgba(77,243,59,0.15); color:var(--primary);
            border-radius:20px; padding:2px 10px; font-size:0.78rem; font-weight:700; margin-left:8px;
        }

        /* Table */
        .tbl-wrap { overflow-x:auto; }
        table { width:100%; border-collapse:collapse; }
        thead th {
            padding:12px 16px; font-size:0.76rem; text-transform:uppercase;
            letter-spacing:.5px; color:#a0aabf; background:rgba(255,255,255,0.03);
            border-bottom:1px solid var(--border); white-space:nowrap;
        }
        tbody tr { border-bottom:1px solid rgba(255,255,255,0.04); transition:background .15s; }
        tbody tr:hover { background:rgba(255,255,255,0.03); }
        tbody td { padding:12px 16px; font-size:0.86rem; vertical-align:middle; }

        .badge-s { padding:4px 10px; border-radius:20px; font-size:0.74rem; font-weight:700; display:inline-block; }
        .b-confirmed { background:rgba(77,243,59,0.15);  color:var(--primary); }
        .b-pending   { background:rgba(251,191,36,0.15); color:#fbbf24; }
        .b-cancelled { background:rgba(239,68,68,0.15);  color:#f87171; }
        .b-paid      { background:rgba(77,243,59,0.15);  color:var(--primary); }
        .b-unpaid    { background:rgba(255,255,255,0.08);color:#a0aabf; }

        .no-data { text-align:center; padding:60px 20px; color:#a0aabf; }
        .no-data i { font-size:2.5rem; margin-bottom:12px; display:block; }
        .spinner { display:inline-block; width:20px; height:20px; border:3px solid rgba(255,255,255,0.15); border-top-color:var(--primary); border-radius:50%; animation:spin .7s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
    </style>
</head>
<body>

<nav class="admin-nav">
    <div class="brand">🎯 Turf <span>Admin</span></div>
    <div style="display:flex;gap:12px;align-items:center;">
        <span id="last-updated" style="font-size:0.8rem;color:#a0aabf;"></span>
        <a href="index.html" class="back-btn"><i class="bi bi-arrow-left me-1"></i>Back to Site</a>
    </div>
</nav>

<div class="page">

    <!-- Stats -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon ic-green"><i class="bi bi-calendar-check-fill"></i></div>
            <div class="stat-label">Total Bookings</div>
            <div class="stat-value" id="s-total">—</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon ic-blue"><i class="bi bi-check-circle-fill"></i></div>
            <div class="stat-label">Confirmed</div>
            <div class="stat-value" id="s-confirmed">—</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon ic-yellow"><i class="bi bi-clock-fill"></i></div>
            <div class="stat-label">Pending</div>
            <div class="stat-value" id="s-pending">—</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon ic-red"><i class="bi bi-x-circle-fill"></i></div>
            <div class="stat-label">Cancelled</div>
            <div class="stat-value" id="s-cancelled">—</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon ic-purple"><i class="bi bi-currency-rupee"></i></div>
            <div class="stat-label">Total Revenue</div>
            <div class="stat-value" id="s-revenue">—</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon ic-cyan"><i class="bi bi-people-fill"></i></div>
            <div class="stat-label">Users</div>
            <div class="stat-value" id="s-users">—</div>
        </div>
        <div class="stat-card">
            <div class="stat-icon ic-orange"><i class="bi bi-geo-alt-fill"></i></div>
            <div class="stat-label">Turfs</div>
            <div class="stat-value" id="s-turfs">—</div>
        </div>
    </div>

    <!-- Bookings Table -->
    <div class="table-card">
        <div class="table-header">
            <div style="display:flex;align-items:center;">
                <h5><i class="bi bi-table me-2" style="color:var(--primary)"></i>All Bookings</h5>
                <span class="count-pill" id="row-count">0</span>
            </div>
            <div class="controls">
                <input class="search-box" id="search" placeholder="🔍  Search turf, user...">
                <select class="flt" id="flt-status">
                    <option value="">All Status</option>
                    <option>CONFIRMED</option>
                    <option>PENDING</option>
                    <option>CANCELLED</option>
                </select>
                <select class="flt" id="flt-payment">
                    <option value="">All Payment</option>
                    <option value="PAID">Paid</option>
                    <option value="PENDING">Unpaid</option>
                </select>
                <button class="refresh-btn" onclick="loadAll()">
                    <i class="bi bi-arrow-clockwise me-1"></i>Refresh
                </button>
            </div>
        </div>
        <div class="tbl-wrap">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Turf</th>
                        <th>Sport</th>
                        <th>User</th>
                        <th>Date</th>
                        <th>Time Slot</th>
                        <th>Booking Status</th>
                        <th>Payment</th>
                        <th>Booking ID</th>
                    </tr>
                </thead>
                <tbody id="tbody">
                    <tr><td colspan="9" class="no-data"><div class="spinner"></div></td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Verify client-side administrator access
    const stored = JSON.parse(localStorage.getItem('user'));
    if (!stored || !stored.isAdmin) {
        alert("Access Denied: Administrator permissions required.");
        window.location.href = "index.html";
    }
    const adminUserId = stored.id;

    let allBookings = [];

    const INR = v => new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',minimumFractionDigits:0}).format(v);

    function fmtDate(dt) {
        if (!dt) return '—';
        return new Date(dt).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
    }
    function fmtTime(dt) {
        if (!dt) return '—';
        const d = new Date(dt);
        const h = d.getHours(), pad = n => String(n).padStart(2,'0');
        return `${pad(h)}:00 – ${pad(h+1)}:00`;
    }
    function sBadge(s) {
        const cls = s==='CONFIRMED'?'b-confirmed':s==='PENDING'?'b-pending':'b-cancelled';
        return `<span class="badge-s ${cls}">${s||'UNKNOWN'}</span>`;
    }
    function pBadge(p) {
        return p==='PAID'
            ? `<span class="badge-s b-paid">✓ PAID</span>`
            : `<span class="badge-s b-unpaid">${p||'UNPAID'}</span>`;
    }

    function render(data) {
        document.getElementById('row-count').textContent = data.length;
        const tbody = document.getElementById('tbody');
        if (!data.length) {
            tbody.innerHTML = `<tr><td colspan="9" class="no-data"><i class="bi bi-inbox"></i>No bookings found</td></tr>`;
            return;
        }
        tbody.innerHTML = data.map((b,i) => `
            <tr>
                <td style="color:#a0aabf;font-size:0.78rem;">${i+1}</td>
                <td><b>${b.turf?.name||'—'}</b></td>
                <td style="color:#a0aabf;">${b.turf?.sportType||'—'}</td>
                <td>
                    <div>${b.user?.username||'—'}</div>
                    <div style="font-size:0.77rem;color:#a0aabf;">${b.user?.email||b.userId||'—'}</div>
                </td>
                <td>${fmtDate(b.startTime)}</td>
                <td><code style="color:var(--primary);font-size:0.82rem;">${fmtTime(b.startTime)}</code></td>
                <td>${sBadge(b.status)}</td>
                <td>${pBadge(b.paymentStatus)}</td>
                <td style="font-size:0.74rem;color:#a0aabf;font-family:monospace;">${b.id?b.id.slice(-10):'—'}</td>
            </tr>`).join('');
    }

    function filter() {
        const q  = document.getElementById('search').value.toLowerCase();
        const fs = document.getElementById('flt-status').value;
        const fp = document.getElementById('flt-payment').value;
        render(allBookings.filter(b => {
            const txt = [b.turf?.name,b.turf?.sportType,b.user?.username,b.user?.email,b.status].join(' ').toLowerCase();
            return (!q||txt.includes(q)) && (!fs||b.status===fs) && (!fp||b.paymentStatus===fp);
        }));
    }

    async function loadStats() {
        const res = await fetch('/api/admin/stats', {
            headers: { 'X-Admin-User-Id': adminUserId }
        });
        if (!res.ok) {
            throw new Error('Unauthorized');
        }
        const s = await res.json();
        document.getElementById('s-total').textContent     = s.totalBookings;
        document.getElementById('s-confirmed').textContent = s.confirmedBookings;
        document.getElementById('s-pending').textContent   = s.pendingBookings;
        document.getElementById('s-cancelled').textContent = s.cancelledBookings;
        document.getElementById('s-revenue').textContent   = INR(s.totalRevenue);
        document.getElementById('s-users').textContent     = s.totalUsers;
        document.getElementById('s-turfs').textContent     = s.totalTurfs;
    }

    async function loadBookings() {
        document.getElementById('tbody').innerHTML =
            `<tr><td colspan="9" style="text-align:center;padding:50px;"><div class="spinner"></div></td></tr>`;
        const res = await fetch('/api/admin/bookings', {
            headers: { 'X-Admin-User-Id': adminUserId }
        });
        if (!res.ok) {
            throw new Error('Unauthorized');
        }
        allBookings = await res.json();
        filter();
        document.getElementById('last-updated').textContent = 'Updated: ' + new Date().toLocaleTimeString();
    }

    async function loadAll() {
        try {
            await Promise.all([loadStats(), loadBookings()]);
        } catch (e) {
            document.getElementById('tbody').innerHTML =
                `<tr><td colspan="9" class="no-data"><i class="bi bi-exclamation-triangle"></i>Session expired or Access Denied</td></tr>`;
        }
    }

    document.getElementById('search').addEventListener('input', filter);
    document.getElementById('flt-status').addEventListener('change', filter);
    document.getElementById('flt-payment').addEventListener('change', filter);

    loadAll();
</script>
</body>
</html>
